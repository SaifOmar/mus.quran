name: Build & Attest Prebuilts

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build binaries
        run: |
          mkdir -p dist/linux-${{ matrix.arch }}
          for bin in quranproxyd quranctl; do
            CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} \
              go build -trimpath -ldflags="-s -w" \
              -o dist/linux-${{ matrix.arch }}/$bin ./cmd/$bin
          done

      - name: Generate checksums
        working-directory: dist/linux-${{ matrix.arch }}
        run: sha256sum quranproxyd quranctl > SHA256SUMS

      - name: Attest binaries
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/linux-${{ matrix.arch }}/quran*
          push-to-registry: true

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/linux-${{ matrix.arch }}/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/linux-amd64/quranproxyd
            artifacts/linux-amd64/quranctl
            artifacts/linux-amd64/SHA256SUMS
            artifacts/linux-arm64/quranproxyd
            artifacts/linux-arm64/quranctl
            artifacts/linux-arm64/SHA256SUMS
          generate_release_notes: true
